name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    name: Conformance, hooks, context budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      # Static checks and hook behaviour need neither Claude Code nor network.
      # The context-budget check needs `claude plugin details`, so it is skipped
      # here and enforced locally before a release; see bench/README.md.
      - name: Conformance
        run: bench/conformance.sh

      - name: Hook behaviour
        run: bench/hooks.sh

      - name: Manifest shape
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            [ -e "$f" ] && python3 -m json.tool "$f" > /dev/null
          done
          echo "manifests parse"
