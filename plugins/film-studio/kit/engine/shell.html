<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* A film is projected on black in both themes, so both token sets resolve to the same values. */
  :root {
    --surround: #000000;
    --ink: #f2eee8;
    --ink-soft: rgba(242, 238, 232, 0.62);
    --ink-faint: rgba(242, 238, 232, 0.28);
    --ember: #ff9a4d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --surround: #000000; --ink: #f2eee8; }
  }
  :root[data-theme="dark"] { --surround: #000000; --ink: #f2eee8; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--surround); color: var(--ink);
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { height: 100%; display: grid; place-items: center; }
  #frame {
    position: relative; overflow: hidden; background: #000;
    height: min(100%, calc(100vw * 16 / 9));
    aspect-ratio: 9 / 16;
    max-width: 100%;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #000; transition: opacity 900ms ease, visibility 0s linear 900ms;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay.soft { background: rgba(0, 0, 0, 0.72); }
  .start { display: grid; justify-items: center; gap: 22px; text-align: center; padding: 24px; }
  .play {
    appearance: none; border: 1px solid var(--ink-faint); background: transparent; color: var(--ink);
    width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    transition: border-color 300ms ease, transform 300ms ease;
  }
  .play:hover { border-color: var(--ink-soft); transform: scale(1.04); }
  .play:focus-visible, .again:focus-visible { outline: 2px solid var(--ember); outline-offset: 6px; }
  .play svg { width: 26px; height: 26px; margin-left: 4px; }
  .hint { margin: 0; font-size: 15px; letter-spacing: 0.01em; color: var(--ink-soft); }
  .hint small { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-faint); }
  .again {
    appearance: none; background: transparent; color: var(--ink); cursor: pointer;
    border: 1px solid var(--ink-faint); border-radius: 999px; padding: 12px 26px;
    font: 500 15px/1 "Instrument Sans", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.01em;
  }
  .again:hover { border-color: var(--ink-soft); }
  #paused {
    position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
    font-size: 13px; color: var(--ink-soft); opacity: 0; transition: opacity 300ms ease; pointer-events: none;
  }
  #paused.on { opacity: 1; }
  #err { display: none; position: absolute; inset: 0; place-items: center; padding: 32px; text-align: center; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
  #err.on { display: grid; }
  @media (prefers-reduced-motion: reduce) { .overlay, .play { transition: none; } }
</style>
</head>
<body>
<main id="stage">
  <div id="frame">
    <canvas id="c" aria-label="{{TITLE}}"></canvas>
    <div id="paused" aria-live="polite">Paused. Press space or tap to continue.</div>
    <div class="overlay" id="startOverlay">
      <div class="start">
        <button class="play" id="playBtn" aria-label="Play the film with sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4a.8.8 0 0 0 1.2.7l13.4-8.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z" fill="currentColor"/></svg>
        </button>
        <p class="hint" id="hint">Preparing the stage<small>Best with sound, in the dark</small></p>
      </div>
    </div>
    <div class="overlay soft hidden" id="endOverlay">
      <button class="again" id="againBtn">Watch again</button>
    </div>
    <div id="err" role="alert">This film renders in real time and needs WebGL 2. Open it in a current version of Chrome, Safari, Edge or Firefox.</div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
/*__LTC__*/
/*__APP__*/
</script>
</body>
</html>
