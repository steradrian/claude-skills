<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFCUT 01 spec ad</title>
<style>
/* fonts were base64-inlined here in the original build: Anton, ArchivoBlack, SpecialElite, Marker (Permanent Marker), PF (Playfair Display, upright + italic, 400-900) */
:root{
  --page:#dcd8cf; --chrome:#1d1b18; --chrome-soft:#6b665e; --btn:#1d1b18; --btn-fg:#efe9dc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#141312; --chrome:#e9e4da; --chrome-soft:#8f897f; --btn:#e9e4da; --btn-fg:#141312; }
}
:root[data-theme="dark"]{ --page:#141312; --chrome:#e9e4da; --chrome-soft:#8f897f; --btn:#e9e4da; --btn-fg:#141312; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--chrome);font-family:'SpecialElite',ui-monospace,monospace;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#viewport{position:relative;flex:0 0 auto}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#141210;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#weave,#shake{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene>.bg{position:absolute;inset:-60px}
.cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.abs{position:absolute}
.grp{position:absolute;transform-origin:50% 50%;will-change:transform}
.card{position:absolute}
.card .fill{position:absolute;inset:0}
.face{display:flex;align-items:center;justify-content:center}
.sh{filter:drop-shadow(0 12px 14px rgba(0,0,0,.33)) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.sh-lite{filter:drop-shadow(0 5px 6px rgba(0,0,0,.28))}
.glyph{line-height:1;display:block;transform:translateY(2%)}
.tw{font-family:'SpecialElite',monospace;white-space:pre;line-height:1}
.pfi{font-family:'PF',serif;font-style:italic;font-weight:900;line-height:1.02;letter-spacing:-.01em}
.anton{font-family:'Anton',sans-serif;line-height:.9}
.marker{font-family:'Marker',cursive;line-height:1}
.tape{position:absolute;transform-origin:50% 50%}
.stamp{position:absolute;font-family:'Anton',sans-serif;border:12px solid currentColor;display:flex;align-items:center;justify-content:center;letter-spacing:.06em;line-height:1;transform-origin:50% 50%}
svg.over{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;pointer-events:none}
#fx canvas,#fx div{position:absolute;inset:0;pointer-events:none}
#grain{width:1080px;height:1920px}
#scratch{width:1080px;height:1920px}
#vig{background:radial-gradient(ellipse 75% 60% at 50% 48%,transparent 58%,rgba(10,6,2,.4) 100%)}
#leak{mix-blend-mode:screen;opacity:0}
#flick{background:#000;opacity:0}
#flash{background:#fff4e2;opacity:0}
#blackout{background:#000;opacity:0}
#wipe{position:absolute;left:-170px;top:0;width:1420px;height:2700px;display:none}
/* controls */
#controls{display:flex;align-items:center;gap:12px;width:var(--cw,360px);max-width:100%;font-size:14px;color:var(--chrome-soft)}
#controls button{appearance:none;border:0;background:var(--btn);color:var(--btn-fg);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #d7301c;outline-offset:3px}
#scrub{flex:1;accent-color:#d7301c;min-width:0}
#time{font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage" role="img" aria-label="15 second vertical spec ad for OFFCUT 01, a sneaker made from factory scraps">
      <div id="weave"><div id="shake"></div></div>
      <div id="wipe"></div>
      <div id="fx">
        <div id="leak"></div>
        <canvas id="grain" width="360" height="640"></canvas>
        <canvas id="scratch" width="540" height="960"></canvas>
        <div id="vig"></div>
        <div id="flick"></div>
        <div id="flash"></div>
        <div id="blackout"></div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="play" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g id="icon"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></g></svg></button>
    <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="time">0.0s</span>
  </div>
</div>
<script>
(()=>{
const W=1080,H=1920,T=15;
const INK='#161310',PAPER='#ece4d3',RED='#d7301c',KRAFT='#b88d5a',DENIM='#2c3a57',GRAY='#b3afa5';

/* ---------- utils ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>{let h=Math.imul(a*374761393+b*668265263|0,1274126177);h=(h^h>>>13)*1274126177;return((h^h>>>16)>>>0)/4294967296};
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const E={lin:x=>x,out3:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),in3:x=>x*x*x,in2:x=>x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
  expo:x=>x>=1?1:1-Math.pow(2,-10*x)};
function kf(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++){const[t0,v0,e]=k[i],[t1,v1]=k[i+1];if(t<t1)return v0+(v1-v0)*E[e||'io']((t-t0)/(t1-t0));}return k[k.length-1][1];}
const q12=t=>Math.floor(t*12)/12;          // collage animates on twos
const boil=(seed,t,amt=.7)=>(hash(seed,Math.floor(t*8))-.5)*2*amt;
const prog=(t,a,d,e='lin')=>E[e](clamp((t-a)/d));
function $(tag,cls,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e}
function place(el,x,y,w,h){el.style.left=(x-w/2)+'px';el.style.top=(y-h/2)+'px';el.style.width=w+'px';el.style.height=h+'px';el._w=w;el._h=h;return el}
function tf(el,x=0,y=0,r=0,s=1,o=1,sx=1){el.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(${(s*sx).toFixed(4)},${s.toFixed(4)})`;el.style.opacity=o}

/* ---------- procedural textures ---------- */
function tex(size,fn,h){const c=document.createElement('canvas');c.width=size;c.height=h||size;fn(c.getContext('2d'),size,h||size);return c.toDataURL()}
const R0=rng(7);
const NOISE=tex(256,(x,s)=>{const d=x.createImageData(s,s);for(let i=0;i<s*s;i++){const v=R0(),w=v>.5?255:0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=w;d.data[i*4+3]=Math.abs(v-.5)*2*38}x.putImageData(d,0,0);
  x.lineWidth=.7;for(let k=0;k<70;k++){x.globalAlpha=.05+R0()*.07;x.strokeStyle=R0()<.5?'#000':'#fff';x.beginPath();const a=R0()*s,b=R0()*s;x.moveTo(a,b);x.quadraticCurveTo(a+R0()*40-20,b+R0()*40-20,a+R0()*60-30,b+R0()*60-30);x.stroke()}});
const MOTTLE=tex(256,(x,s)=>{for(let k=0;k<120;k++){const a=R0()*s,b=R0()*s,r=6+R0()*30;const g=x.createRadialGradient(a,b,0,a,b,r);const dark=R0()<.6;g.addColorStop(0,dark?'rgba(60,30,10,.16)':'rgba(255,240,210,.12)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(a-r,b-r,r*2,r*2)}});
const SPECK=tex(140,(x,s)=>{for(let k=0;k<90;k++){x.fillStyle=`rgba(${50+R0()*40|0},${28+R0()*20|0},12,${.35+R0()*.5})`;x.beginPath();x.ellipse(R0()*s,R0()*s,.6+R0()*2.4,.5+R0()*1.8,R0()*3,0,7);x.fill()}});
const DISTRESS=tex(512,(x,s,h)=>{x.fillStyle='#000';x.fillRect(0,0,s,h);x.globalCompositeOperation='destination-out';
  for(let k=0;k<650;k++){x.globalAlpha=.35+R0()*.6;x.beginPath();x.arc(R0()*s,R0()*h,.4+Math.pow(R0(),3)*4,0,7);x.fill()}
  for(let k=0;k<10;k++){x.globalAlpha=.2+R0()*.5;x.lineWidth=.8+R0()*2.6;x.beginPath();const y=R0()*h;x.moveTo(R0()*s*.3,y);x.lineTo(s*(.5+R0()*.5),y+R0()*14-7);x.stroke()}
  x.globalAlpha=.55;for(let k=0;k<5;k++){const a=R0()*s,b=R0()*h,r=20+R0()*40;const g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(a-r,b-r,2*r,2*r)}},256);
const N=`url(${NOISE})`;
const TX={
  paper:`${N},${PAPER}`,
  news:`${N},repeating-linear-gradient(0deg,rgba(22,19,16,.07) 0 3px,transparent 3px 9px),#d9d2c1`,
  stripes:`${N},repeating-linear-gradient(90deg,${PAPER} 0 16px,${INK} 16px 25px,${PAPER} 25px 30px,${RED} 30px 33px,${PAPER} 33px 46px)`,
  half:`${N},radial-gradient(circle,${INK} 0 3.3px,transparent 3.9px) 0 0/13px 13px,${RED}`,
  kraft:`${N},url(${MOTTLE}),${KRAFT}`,
  grid:`${N},linear-gradient(#8d897f 1.6px,transparent 1.6px) 0 0/19px 19px,linear-gradient(90deg,#8d897f 1.6px,transparent 1.6px) 0 0/19px 19px,${GRAY}`,
  denim:`${N},repeating-linear-gradient(45deg,rgba(236,228,211,.17) 0 2px,transparent 2px 7px),${DENIM}`,
  laces:`${N},repeating-linear-gradient(-32deg,${PAPER} 0 7px,transparent 7px 30px),${INK}`,
  cork:`${N},url(${SPECK}),#c49b6a`,
  ink:`${N},${INK}`,
  red:`${N},${RED}`,
  gray:`${N},${GRAY}`,
};

/* torn / cut paper edges as clip polygons */
function torn(seed,{jit=1.6,step=2.2,ins=0,edges='tttt'}={}){
  const r=rng(seed),P=[],e=edges;const J=k=>e[k]==='t'?r()*jit:r()*.2;const st=()=>step*(.35+r()*1.3);
  for(let x=ins;x<=100-ins;x+=st())P.push([x,ins+J(0)]);
  for(let y=ins;y<=100-ins;y+=st())P.push([100-ins-J(1),y]);
  for(let x=100-ins;x>=ins;x-=st())P.push([x,100-ins-J(2)]);
  for(let y=100-ins;y>=ins;y-=st())P.push([ins+J(3),y]);
  return `polygon(${P.map(p=>p[0].toFixed(2)+'% '+p[1].toFixed(2)+'%').join(',')})`;
}
function card(parent,{x,y,w,h,bg,seed=1,edges='tttt',jit=1.8,step=2.2,rim='#f6f2e9',sh='sh'}){
  const el=$('div','card '+(sh||''),parent);place(el,x,y,w,h);
  if(rim){const rm=$('div','fill',el);rm.style.background=`${N},${rim}`;rm.style.clipPath=torn(seed,{jit:jit*1.15,step,edges})}
  const f=$('div','fill face',el);f.style.background=bg;f.style.clipPath=torn(seed+97,{jit,step,edges,ins:rim?.8:0});el.face=f;return el;
}
function tape(parent,x,y,w,h=58,seed=3){const t=$('div','tape sh-lite',parent);place(t,x,y,w,h);t.style.background=`${N},rgba(228,216,178,.82)`;t.style.clipPath=torn(seed,{jit:4.5,step:7,edges:'ctct'});return t}
function grp(parent,x,y,w,h){const g=$('div','grp',parent);place(g,x,y,w,h);return g}

/* ransom-note lettering */
const RS=[
  {bg:TX.paper,c:INK,f:"'Anton'",wf:.5,fs:1},
  {bg:TX.ink,c:PAPER,f:"'PF'",it:1,wf:.74,fs:.9},
  {bg:TX.red,c:INK,f:"'ArchivoBlack'",wf:.8,fs:.78},
  {bg:TX.news,c:INK,f:"'SpecialElite'",wf:.64,fs:.95},
  {bg:TX.kraft,c:INK,f:"'Anton'",wf:.5,fs:1.05},
  {bg:TX.paper,c:RED,f:"'PF'",it:1,wf:.74,fs:.92},
  {bg:TX.gray,c:INK,f:"'ArchivoBlack'",wf:.8,fs:.76},
  {bg:TX.ink,c:RED,f:"'Anton'",wf:.5,fs:1},
];
function ransom(parent,word,{cx,cy,size,seed,gap=8,order}){
  const r=rng(seed),L=[];let last=-1,total=0;
  [...word].forEach((ch,i)=>{let si=order?order[i%order.length]:Math.floor(r()*RS.length);if(!order&&si===last)si=(si+3)%RS.length;last=si;const st=RS[si];
    const sc=.9+r()*.22;const w=ch==='.'?size*.42:size*st.wf*st.fs*sc+size*.34;const h=size*1.22*(.92+r()*.16);L.push({ch,st,sc,w,h});total+=w+gap});
  total-=gap;let x=cx-total/2;
  return L.map((l,i)=>{const X=x+l.w/2;x+=l.w+gap;const Y=cy+(r()-.5)*size*.16;const rot=(r()-.5)*14;
    const g=grp(parent,X,Y,l.w,l.h);const c=card(g,{x:l.w/2,y:l.h/2,w:l.w,h:l.h,bg:l.st.bg,seed:seed*31+i*7,jit:2.6,step:4,edges:['tctc','cttt','tttc','cctt'][i%4]});
    const gl=$('span','glyph',c.face);gl.textContent=l.ch;Object.assign(gl.style,{fontFamily:l.st.f,fontSize:(size*l.st.fs*l.sc)+'px',color:l.st.c,fontStyle:l.st.it?'italic':'normal',fontWeight:l.st.it?900:400});
    return {g,X,Y,rot,i,seed:seed*13+i};});
}

/* typewriter helper */
function typer(el,text){el._t=text;el._n=-1;return el}
function typeTo(el,n){n=clamp(Math.floor(n),0,el._t.length);if(n!==el._n){el.textContent=el._t.slice(0,n)||'\u200b';el._n=n}}

/* ---------- the shoe ---------- */
let SHOE_N=0;
const PATS=['stripes','half','kraft','denim','grid','cork','cream','laces'];
function shoeSVG(notes){
  const p='s'+(SHOE_N++)+'_';
  const Y=y=>400-(400-y)*1.42;const sy=d=>d.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g,(m,a,b)=>a+' '+Y(+b).toFixed(1));
  const NI=`<image href="${NOISE}" width="256" height="256" opacity="1"/>`;
  const defs=`
  <pattern id="${p}stripes" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><rect width="46" height="46" fill="${PAPER}"/><rect x="16" width="9" height="46" fill="${INK}"/><rect x="30" width="3" height="46" fill="${RED}"/>${NI}</pattern>
  <pattern id="${p}half" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><rect width="13" height="13" fill="${RED}"/><circle cx="6.5" cy="6.5" r="3.4" fill="${INK}"/></pattern>
  <pattern id="${p}kraft" width="256" height="256" patternUnits="userSpaceOnUse"><rect width="256" height="256" fill="${KRAFT}"/><image href="${MOTTLE}" width="256" height="256"/>${NI}</pattern>
  <pattern id="${p}denim" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="${DENIM}"/><rect width="2.2" height="8" fill="rgba(236,228,211,.2)"/></pattern>
  <pattern id="${p}grid" width="19" height="19" patternUnits="userSpaceOnUse"><rect width="19" height="19" fill="${GRAY}"/><path d="M0 .8H19M.8 0V19" stroke="#8d897f" stroke-width="1.6"/></pattern>
  <pattern id="${p}cork" width="140" height="140" patternUnits="userSpaceOnUse"><rect width="140" height="140" fill="#c49b6a"/><image href="${SPECK}" width="140" height="140"/></pattern>
  <pattern id="${p}cream" width="256" height="256" patternUnits="userSpaceOnUse"><rect width="256" height="256" fill="${PAPER}"/>${NI}</pattern>
  <pattern id="${p}laces" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><rect width="30" height="30" fill="${INK}"/><rect width="7" height="30" fill="${PAPER}"/></pattern>`;
  const up=sy('M80 398 C60 330 66 250 122 196 C170 186 220 180 262 190 C300 205 335 225 372 232 L430 150 C455 138 500 136 528 146 L560 275 C620 290 670 302 720 312 C800 338 880 350 930 368 C962 380 972 398 962 410 Z');
  const mid='M70 396 L964 408 C976 424 973 441 960 451 L78 447 C65 432 64 412 70 396 Z';
  const out='M78 447 L960 451 C969 463 959 476 940 478 L98 476 C80 474 71 461 78 447 Z';
  const tab=sy('M118 204 L106 150 C110 139 128 136 137 145 L152 194 Z');const tng=sy('M372 232 L430 150 C455 138 500 136 528 146 L560 275 Z');
  const O=`stroke="${INK}" stroke-width="5.5" stroke-linejoin="round"`;
  let eyelets='',laces='';
  [400,452,504,556,608,660].forEach((x,i)=>{const y=Y(232+(x-372)*.23+9);eyelets+=`<circle cx="${x}" cy="${y}" r="5.5" fill="${PAPER}" stroke="${INK}" stroke-width="2"/>`;
    if(i<4)laces+=`<path d="M${x} ${y} L${x+40} ${y-80}" stroke="${INK}" stroke-width="19" stroke-linecap="round"/><path d="M${x} ${y} L${x+40} ${y-80}" stroke="${PAPER}" stroke-width="10" stroke-linecap="round"/>`});
  const bow=sy('M470 186 C430 126 380 156 420 196 M478 186 C470 116 530 116 505 182');laces+=`<path d="${bow}" fill="none" stroke="${INK}" stroke-width="18" stroke-linecap="round"/><path d="${bow}" fill="none" stroke="${PAPER}" stroke-width="9" stroke-linecap="round"/>`;
  const ST=`fill="none" stroke="${PAPER}" stroke-width="3.5" stroke-dasharray="11 7" stroke-linecap="round" opacity=".95"`;
  const svg=`<svg viewBox="0 0 1000 520" width="100%" height="100%" style="overflow:visible;display:block">
  <defs>${defs}</defs>
  <g class="pg" data-k="sticker"><g fill="#f6f2e9" stroke="#f6f2e9" stroke-width="40" stroke-linejoin="round"><path d="${up}"/><path d="${mid}"/><path d="${out}"/><path d="${tab}"/><path d="${tng}"/></g></g>
  <g class="pg" data-k="out"><path d="${out}" fill="${INK}" ${O}/><path d="M110 466 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9 l14 -9 l14 9" fill="none" stroke="${PAPER}" stroke-width="2.5" opacity=".55"/></g>
  <g class="pg" data-k="mid"><path d="${mid}" fill="url(#${p}cream)" ${O}/><path d="M84 424 L956 432" stroke="${RED}" stroke-width="11"/></g>
  <g class="pg" data-k="tongue"><path d="${tng}" data-f="grid" fill="url(#${p}grid)" ${O}/></g>
  <g class="pg" data-k="heel"><path d="${sy('M80 398 C60 330 66 250 122 196 C150 190 185 184 215 182 C228 250 236 320 250 400 Z')}" data-f="kraft" fill="url(#${p}kraft)" ${O}/><path d="${sy('M204 192 C216 256 224 322 236 396')}" ${ST}/></g>
  <g class="pg" data-k="quarter"><path d="${sy('M215 182 C240 182 252 184 262 190 C300 205 335 225 372 232 L560 275 C560 310 575 350 600 404 L250 400 C236 320 228 250 215 182 Z')}" data-f="stripes" fill="url(#${p}stripes)" ${O}/><path d="${sy('M228 196 C300 214 340 240 380 246')}" ${ST}/></g>
  <g class="pg" data-k="vamp"><path d="${sy('M560 275 C620 290 670 302 720 312 C760 324 790 332 815 338 C790 360 775 385 770 406 L600 404 C575 350 560 310 560 275 Z')}" data-f="denim" fill="url(#${p}denim)" ${O}/><path d="${sy('M574 290 C574 322 587 358 612 402')}" ${ST}/></g>
  <g class="pg" data-k="toe"><path d="${sy('M815 338 C860 346 900 355 930 368 C962 380 972 398 962 410 L770 406 C775 385 790 360 815 338 Z')}" data-f="half" fill="url(#${p}half)" ${O}/><path d="${sy('M806 348 C786 366 774 386 768 402')}" ${ST}/></g>
  <g class="pg" data-k="eyestay"><path d="${sy('M372 232 L720 312 L716 332 L368 252 Z')}" fill="${INK}" ${O}/>${eyelets}</g>

  const shoe=makeShoe(s.cam,540,1060,940);
  const tag=typer($('div','abs pfi',s.cam,{fontSize:'92px',color:INK,textAlign:'center',whiteSpace:'nowrap'}),"Made from what\u2019s left.");place(tag,540,1420,1000,110);
  const stamp=$('div','stamp',s.cam,{color:RED,fontSize:'96px',padding:'8px 26px 2px',WebkitMaskImage:`url(${DISTRESS})`,maskImage:`url(${DISTRESS})`,WebkitMaskSize:'cover',maskSize:'cover',mixBlendMode:'multiply'});stamp.style.whiteSpace='nowrap';stamp.textContent='DROP 10.10';place(stamp,740,1650,560,150);
  const url=typer($('div','abs tw',s.cam,{fontSize:'42px',color:INK}),'offcut.studio');place(url,270,1660,380,60);
  R.forEach(l=>kick(11.55+.1+l.i*.06+.3,3));kick(11.55+.85,18);kick(11.55+1.28,8);kick(11.55+2.28,12);
  s.render=(t,lt)=>{
    const tq=q12(lt);const clean=lt>=.85;
    R.forEach(l=>{const st=.1+l.i*.06;const p=clamp((tq-st)/.3);const e=E.out5(p);tf(l.g,l.dx*(1-e),l.dy*(1-e),l.rot+l.dr*(1-e)+boil(l.seed,lt,1),1,(p>0&&!clean)?1:0)});
    tf(logo,0,0,-2,clean?1+.05*Math.exp(-(lt-.85)*10):1,clean?1:0);
    const sp=clamp((tq-.95)/.33);tf(shoe,0,lerp(-1500,0,E.back(sp)),-7+boil(4,lt,.4),1,sp>0?1:0);
    typeTo(tag,(lt-1.45)/.04);
    const st=prog(lt,2.16,.12,'in3');tf(stamp,0,0,8,lerp(2.6,1,st),st>0?.9:0);
    typeTo(url,(lt-2.2)/.025);
    tf(sheet,0,0,1.5);tf(tA,0,0,-3);
    tf(s.cam,0,kf(lt,[[0,-20],[3.45,20]]),kf(lt,[[0,.6],[3.45,-.4]]),kf(lt,[[0,1.08],[3.45,1.0]],'out3'));
  };
}

/* ---------- film layer ---------- */
const grain=document.getElementById('grain'),gx=grain.getContext('2d');
const GF=[];{const r=rng(123);for(let f=0;f<8;f++){const d=gx.createImageData(360,640);for(let i=0;i<360*640;i++){const v=r();const w=v>.5?255:0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=w;d.data[i*4+3]=Math.pow(Math.abs(v-.5)*2,1.4)*60}GF.push(d)}}
const scr=document.getElementById('scratch'),sx=scr.getContext('2d');
const leak=document.getElementById('leak'),flick=document.getElementById('flick'),flash=document.getElementById('flash'),blackout=document.getElementById('blackout');
const weave=document.getElementById('weave'),shakeEl=root;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bump=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
let lastF=-1;
function film(t){
  const f=Math.floor(t*24);
  if(f!==lastF){lastF=f;
    gx.putImageData(GF[f%GF.length],0,0);
    sx.clearRect(0,0,540,960);const r=rng(f*7+1);
    const nl=r()<.45?1+(r()<.3?1:0):0;for(let i=0;i<nl;i++){const x=hash(Math.floor(f/5),i)*540;sx.strokeStyle=`rgba(${r()<.6?'255,248,230':'20,14,8'},${.18+r()*.25})`;sx.lineWidth=.6+r()*.9;sx.beginPath();sx.moveTo(x,0);sx.bezierCurveTo(x+r()*6-3,320,x+r()*6-3,640,x+r()*4-2,960);sx.stroke()}
    const nd=Math.floor(r()*4);for(let i=0;i<nd;i++){sx.fillStyle=r()<.7?`rgba(20,14,8,${.5+r()*.4})`:`rgba(255,248,230,${.5+r()*.4})`;sx.beginPath();sx.ellipse(r()*540,r()*960,.8+r()*2.6,.6+r()*1.8,r()*3,0,7);sx.fill()}
    if(r()<.05){sx.strokeStyle='rgba(20,14,8,.55)';sx.lineWidth=1.1;sx.beginPath();const a=r()*540,b=r()*960;sx.moveTo(a,b);sx.bezierCurveTo(a+r()*80-40,b+r()*80-40,a+r()*80-40,b+r()*80-40,a+r()*90-45,b+r()*90-45);sx.stroke()}
    const wv=reduce?0:1;weave.style.transform=`translate(${((hash(f,1)-.5)*3.2*wv).toFixed(2)}px,${((hash(f,2)-.5)*2.4*wv).toFixed(2)}px) rotate(${((hash(f,3)-.5)*.12*wv).toFixed(3)}deg)`;
    let fl=hash(f,4)*.05;[[8.55,.35],[9.3,.3],[10.05,.3],[10.8,.3],[12.4,.25]].forEach(([c,a])=>{if(Math.floor(c*24)===f)fl=Math.max(fl,0)});
    flick.style.opacity=reduce?0:fl;
    let fs=0;[8.55,9.3,10.05,10.8,12.4,5.45].forEach(c=>{if(f===Math.floor(c*24))fs=.55});flash.style.opacity=fs;
  }
  // light leaks / burns
  const lk=Math.max(.55*bump(t,2.45,.12),.7*bump(t,5.28,.1),.95*bump(t,8.45,.16),.6*bump(t,11.5,.12),1*bump(t,14.8,.2),.06+.04*Math.sin(t*1.7));
  const lx=30+Math.sin(t*.9)*40,ly=20+Math.cos(t*.7)*30;
  leak.style.background=`radial-gradient(ellipse 60% 40% at ${lx}% ${ly}%,rgba(255,150,40,.85),transparent 70%),radial-gradient(ellipse 45% 35% at ${100-lx}% ${90-ly*.5}%,rgba(255,60,10,.7),transparent 70%),radial-gradient(ellipse 30% 22% at ${lx+20}% ${ly+10}%,rgba(255,236,190,.9),transparent 70%)`;
  leak.style.opacity=clamp(t<.25?lk*.2:lk);
  blackout.style.opacity=Math.max(kf(t,[[0,1],[.12,.0,'out3']]),kf(t,[[14.62,0,'in2'],[15,1]]));
}
function shake(t){let x=0,y=0,r=0;const f=Math.floor(t*30);
  for(const [ti,m] of IMP){const d=t-ti;if(d<0||d>.6)continue;const a=m*Math.exp(-d*12);x+=(hash(f,ti*100|0)-.5)*2*a;y+=(hash(f+9,ti*100|0)-.5)*2*a;r+=(hash(f+3,ti*100|0)-.5)*.35*a/10}
  shakeEl.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg)`;}

function render(t){
  for(const s of SC){const on=t>=s.a&&t<s.b;if(on!==s.on){s.el.style.display=on?'block':'none';s.on=on}if(on)s.render(t,t-s.a)}
  // torn wipe 2.22 – 2.55
  if(t>=2.2&&t<2.55){wipe.style.display='block';const y=kf(t,[[2.2,2000],[2.55,-170,'io']]);wipe.style.transform=`translate(0,${y}px) rotate(-4deg)`}else wipe.style.display='none';
  shake(reduce?-9:t);film(t);
}

/* ---------- playback + fit ---------- */
const vp=document.getElementById('viewport'),stage=document.getElementById('stage'),ctr=document.getElementById('controls');
function fit(){const aw=innerWidth-24,ah=innerHeight-24-54-parseFloat(getComputedStyle(document.documentElement).paddingTop)-parseFloat(getComputedStyle(document.documentElement).paddingBottom);
  const sc=Math.max(.1,Math.min(aw/W,ah/H));stage.style.transform=`scale(${sc})`;vp.style.width=W*sc+'px';vp.style.height=H*sc+'px';stage.style.borderRadius=(18/sc)+'px';document.documentElement.style.setProperty('--cw',Math.max(260,W*sc)+'px')}
addEventListener('resize',fit);fit();
const btn=document.getElementById('play'),icon=document.getElementById('icon'),scrub=document.getElementById('scrub'),time=document.getElementById('time');
let playing=true,cur=0,base=0,scrubbing=false;
function setPlaying(p){playing=p;base=performance.now()-cur*1000;btn.setAttribute('aria-label',p?'Pause':'Play');
  icon.innerHTML=p?'<rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/>':'<path d="M4 2 L14 8 L4 14 Z" fill="currentColor"/>'}
btn.onclick=()=>setPlaying(!playing);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlaying(!playing)}});
scrub.addEventListener('input',()=>{scrubbing=true;cur=+scrub.value;base=performance.now()-cur*1000;render(cur)});
scrub.addEventListener('change',()=>{scrubbing=false});
function loop(now){if(playing&&!scrubbing){cur=((now-base)/1000)%T}render(cur);scrub.value=cur;time.textContent=cur.toFixed(1)+'s';requestAnimationFrame(loop)}
window.__render=t=>{playing=false;cur=t;render(t)};
const qs=new URLSearchParams(location.search);
document.fonts.ready.then(()=>{if(qs.has('t')){setPlaying(false);cur=+qs.get('t')}else setPlaying(true);requestAnimationFrame(loop)});
})();
</script>
